<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="wef-banner-title">
  <title id="wef-banner-title">Website Excellence Framework</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#111C33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4A254"/>
      <stop offset="100%" stop-color="#E8C07D"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- corner blueprint ticks -->
  <g stroke="#D4A254" stroke-opacity="0.5" stroke-width="1.5">
    <path d="M40 40 h24 M40 40 v24" fill="none"/>
    <path d="M1160 40 h-24 M1160 40 v24" fill="none"/>
    <path d="M40 260 h24 M40 260 v-24" fill="none"/>
    <path d="M1160 260 h-24 M1160 260 v-24" fill="none"/>
  </g>

  <!-- module block glyph: core square + orbiting module nodes -->
  <g transform="translate(120,150)">
    <rect x="-34" y="-34" width="68" height="68" rx="10" fill="none" stroke="url(#accent)" stroke-width="2.5"/>
    <rect x="-14" y="-14" width="28" height="28" rx="5" fill="#D4A254" fill-opacity="0.9"/>
    <g stroke="#8FA3C7" stroke-width="1.5" stroke-opacity="0.7">
      <line x1="34" y1="0" x2="70" y2="-46"/>
      <line x1="34" y1="0" x2="70" y2="0"/>
      <line x1="34" y1="0" x2="70" y2="46"/>
    </g>
    <circle cx="70" cy="-46" r="6" fill="#E8C07D"/>
    <circle cx="70" cy="0" r="6" fill="#E8C07D"/>
    <circle cx="70" cy="46" r="6" fill="#E8C07D"/>
  </g>

  <text x="230" y="132" font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#F5F1E8" font-weight="600">Website Excellence Framework</text>
  <text x="230" y="168" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#9FB1CE" letter-spacing="0.3">An open, AI-assisted methodology for regulated &amp; specialized industries</text>

  <line x1="230" y1="192" x2="960" y2="192" stroke="url(#accent)" stroke-width="1.5" stroke-opacity="0.6"/>

  <text x="230" y="222" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#7488A8" letter-spacing="1.5">CORE METHODOLOGY</text>
  <text x="470" y="222" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#7488A8">·</text>
  <text x="490" y="222" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#7488A8" letter-spacing="1.5">INDUSTRY MODULES</text>
  <text x="750" y="222" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#7488A8">·</text>
  <text x="770" y="222" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#7488A8" letter-spacing="1.5">STAGE GATES</text>
</svg>
